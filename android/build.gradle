allprojects {
    repositories {
        google()
        mavenCentral()
        // Chaquopy Python runtime artifacts (`com.chaquo.python:target`) used by
        // the universal flavor's downloader. Required for the plugin to resolve
        // and inject its dependency into the compile classpath.
        maven { url "https://chaquo.com/maven" }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
