plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Chaquopy (CPython + yt-dlp) is applied ONLY when a `universal` variant is
// part of this build. Scoping via `chaquopy { productFlavors { universal } }`
// alone is NOT enough: the plugin still packages its bootstrap/stdlib/.so
// and Java API into `standard` APKs (verified by archive inspection).
// Skipping the plugin entirely for standard-only builds keeps every Python
// trace out of the Play Store APK.
//
// A plain `flutter build` aggregates every flavor under `assembleDebug`,
// so "standard-only" is defined as: every requested task names the standard
// flavor and none names universal. Release discipline: always build flavors
// explicitly, e.g.
//   flutter build apk --flavor standard --dart-define=ENABLE_DOWNLOADER=false
def taskNamesLower = gradle.startParameter.taskNames*.toLowerCase()
def standardOnlyBuild = !taskNamesLower.isEmpty() &&
    taskNamesLower.every { it.contains('standard') } &&
    taskNamesLower.every { !it.contains('niversal') }
if (!standardOnlyBuild) {
    apply plugin: 'com.chaquo.python'
}

android {
    namespace = "com.ajayff4.fileexplorer"
    compileSdk = 37
    ndkVersion = flutter.ndkVersion

    flavorDimensions "store"
    productFlavors {
        universal {
            dimension "store"
        }
        standard {
            dimension "store"
        }
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.ajayff4.fileexplorer"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        ndk {
            // Chaquopy ships CPython only for 64-bit ABIs (Python 3.13+).
            abiFilters += ["arm64-v8a", "x86_64"]
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

if (!standardOnlyBuild) {
chaquopy {
    // Scope the Python runtime/yt-dlp to the `universal` flavor only. Note
    // this scoping alone does NOT keep the runtime out of `standard` APKs
    // (see the plugin gate above) — it only configures the universal side.
    productFlavors {
        universal {
            version "3.12"
            // yt-dlp discovers plugins by scanning sys.path for a physical
            // `yt_dlp_plugins/extractor` directory, so the vendored Threads plugin
            // must exist as real files rather than Chaquopy's in-APK virtual FS.
            extractPackages("yt_dlp_plugins")
            pip {
                install "yt-dlp"
                // Threads has no upstream yt-dlp extractor; the community plugin
                // is vendored in src/universal/python/yt_dlp_plugins (with __init__.py
                // files) because Chaquopy cannot import the upstream package, which
                // is a PEP 420 namespace package with no __init__.py.
            }
        }
    }
}
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.core:core:1.13.1"
}
