org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
# The app targets Java 17; the auto-detected JDK 21 on this machine is a JRE
# with no `javac`. Pin Gradle's toolchain to the real JDK 17 so plugin modules
# (e.g. flutter_plugin_android_lifecycle) can compile.
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64
android.useAndroidX=true
android.enableJetifier=true
android.newDsl=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# Let the app's own android.defaultConfig.ndk.abiFilters decide which ABIs to
# build instead of Flutter's default list. Required because Chaquopy only ships
# CPython for 64-bit ABIs.
disable-abi-filtering=true
