plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Apply Chaquopy — which bundles CPython + yt-dlp into the APK. The plugin is
// applied unconditionally, but the Python config is scoped to the `universal`
// flavor (see the `chaquopy { productFlavors { universal { ... } } }` block
// below), so the `standard` (Play Store) flavor stays 100% free of any Python
// runtime, yt-dlp wheel, or downloader MethodChannel.
//
// The config used to be gated behind a task-name check for `*universal*`, but
// `flutter build apk --debug` runs `assembleDebug`, which aggregates EVERY
// flavor, so that check was false and Chaquopy never got configured — leaving
// the `universal` Kotlin sources (DownloaderBridge.kt) unable to resolve
// `com.chaquo.python.*`. Scoping by flavor instead fixes it for all build
// invocations.
apply plugin: 'com.chaquo.python'

android {
    namespace = "com.ajayff4.fileexplorer"
    compileSdk = 37
    ndkVersion = flutter.ndkVersion

    flavorDimensions "store"
    productFlavors {
        universal {
            dimension "store"
        }
        standard {
            dimension "store"
        }
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.ajayff4.fileexplorer"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        ndk {
            // Chaquopy ships CPython only for 64-bit ABIs (Python 3.13+).
            abiFilters += ["arm64-v8a", "x86_64"]
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

chaquopy {
    // Scope the Python runtime/yt-dlp to the `universal` flavor only, so the
    // `standard` flavor never ships any Python code. Chaquopy adds the
    // `com.chaquo.python:target` dependency and packages Python solely for the
    // variants whose flavor is configured here.
    productFlavors {
        universal {
            version "3.12"
            // yt-dlp discovers plugins by scanning sys.path for a physical
            // `yt_dlp_plugins/extractor` directory, so the vendored Threads plugin
            // must exist as real files rather than Chaquopy's in-APK virtual FS.
            extractPackages("yt_dlp_plugins")
            pip {
                install "yt-dlp"
                // Threads has no upstream yt-dlp extractor; the community plugin
                // is vendored in src/universal/python/yt_dlp_plugins (with __init__.py
                // files) because Chaquopy cannot import the upstream package, which
                // is a PEP 420 namespace package with no __init__.py.
            }
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.core:core:1.13.1"
}
